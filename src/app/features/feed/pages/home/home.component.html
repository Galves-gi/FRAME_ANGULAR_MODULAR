<!-- <h1 class="titulo-centro">Galeria</h1> -->
    <div *ngIf="filteredPhotos.length === 0">
        <p class="titulo-centro">Nenhuma imagem emcontrada!</p>
    </div>
<section class="galeria">
    
    <div 
    class="galeria-img" 
    *ngFor="let photo of filteredPhotos"
    [routerLink]="['/detail', photo.id]"
    >
        <img [src]="photo.image" [alt]="photo.text">

    </div>

</section>
